name: 'Basic Build and Publish with Attestation: Docker'
on:
  workflow_dispatch:

permissions:
  id-token: write
  security-events: write
  attestations: write

env:
  DOCKER_REPOSITORY: 'p-apitesting-docker-multiarch-local'
  IMAGE_NAME: 'hello-frog-multi-arch'

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.0.0
        with:
          driver: docker-container

      - name: Setup JF CLI
        id: jfrog-cli
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_PROJECT: p-apitesting
        with:
          oidc-provider-name: 'github-oidc-integration'

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.JF_DOCKER_REGISTRY }}
          username: ${{ steps.jfrog-cli.outputs.oidc-user }}
          password: ${{ steps.jfrog-cli.outputs.oidc-token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        id: build-and-push
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.JF_DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY}}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Attest
        uses: actions/attest-build-provenance@v3
        id: attest
        with:
          subject-name: oci://${{ vars.JF_DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY}}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
